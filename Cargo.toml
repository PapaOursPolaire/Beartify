[package]
name        = "beartify"
version     = "1.0.0"
description = "Beartify Music Player"
authors     = ["you"]
edition     = "2021"

[lib]
name       = "beartify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell           = "2"
tauri-plugin-http            = "2"
tauri-plugin-deep-link       = "2"
tauri-plugin-opener          = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-oauth           = "2"
tauri-plugin-notification    = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
discord-rich-presence = "1.1.0"

# Nécessaire pour désactiver le Tracking Prevention de WebView2 (Windows
# uniquement) — Tauri l'utilise déjà en interne mais ne l'expose pas
# directement, donc on l'ajoute explicitement pour accéder à
# ICoreWebView2Profile3::PreferredTrackingPreventionLevel.
# ⚠️ Version à ajuster si `cargo build` signale une incompatibilité avec
# la version interne utilisée par `tauri = "2"` (erreurs de type sur les
# interfaces COM en cas de désaccord de version).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
strip     = false
