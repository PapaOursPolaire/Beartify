<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beartify — Mini Player</title>
  <!-- Mêmes CSS que index.html → rendu pixel-perfect -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../fullscreen/fullscreen.css">
  <link rel="stylesheet" href="../lyrics/spicy-lyrics.css">
  <link rel="stylesheet" href="mini-player.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
    /* En fenêtre Tauri la cover-overlay est fixed → ne suit pas le :hover de mp-root.
       On la repasse en absolute pour que CSS hover fonctionne. */
    .mp-cover-overlay{position:absolute!important;}
    .mp-root:hover .mp-cover-overlay{top:0!important;pointer-events:auto!important;}
    /* Bouton fermer dans overlay top */
    #tauriCloseBtn{cursor:pointer;}
  </style>
</head>
<body>

<!-- Exactement le même HTML que _widgetHTML() dans mini-player.js -->
<div class="mp-root" id="mpRoot">
  <div class="mp-header">
    <div class="mp-cover-thumb" id="mpCoverThumb">
      <img id="mpCoverImg" src="../pictures/default-cover.png" alt="Pochette">
    </div>
    <div class="mp-meta">
      <div class="mp-title-wrap"  id="mpTitleWrap" ><span class="marquee-inner">—</span></div>
      <div class="mp-artist-wrap" id="mpArtistWrap"><span class="marquee-inner">—</span></div>
    </div>
  </div>
  <div class="mp-content" id="mpContent">
    <canvas class="mp-dynbg-canvas" id="mpDynBgCanvas"></canvas>
    <div class="mp-lyrics-slot" id="mpLyricsSlot"></div>
    <div class="mp-queue-slot"  id="mpQueueSlot"></div>
  </div>
  <div class="mp-cover-overlay" id="mpCoverOverlay">
    <img class="mp-overlay-img" id="mpOverlayImg" src="../pictures/default-cover.png" alt="">
    <div class="mp-cover-controls">
      <div class="mp-overlay-top">
        <button class="mp-icon-btn" id="mpQueueToggle" title="File d'attente">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
            <path d="M15 15H1v-1.5h14zm0-4.5H1V9h14zm-14-7A2.5 2.5 0 0 1 3.5 1h9a2.5 2.5 0 0 1 0 5h-9A2.5 2.5 0 0 1 1 3.5m2.5-1a1 1 0 0 0 0 2h9a1 1 0 1 0 0-2z"></path>
          </svg>
        </button>
        <button class="mp-icon-btn" id="mpDynBgToggle" title="Fond dynamique">
          <!-- Même tracé que #immBtnDynBg dans fullscreen.js -->
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
            <path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8L12 2z"/>
            <path d="M19 14l.8 2.6L22 17.5l-2.2.9L19 21l-.8-2.6-2.2-.9 2.2-.9L19 14z"/>
          </svg>
        </button>
        <button class="mp-icon-btn" id="tauriCloseBtn" title="Fermer">
          <span style="font-size:11px;font-weight:700;color:#fff">✕</span>
        </button>
      </div>
      <div class="mp-transport">
        <button class="mp-ctrl-btn" id="mpBtnShuffle" title="Aléatoire">
          <svg class="mp-ctrl-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75z"></path>
            <path d="m7.5 10.723.98-1.167.957 1.14a2.25 2.25 0 0 0 1.724.804h1.947l-1.017-1.018a.75.75 0 1 1 1.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 1 1-1.06-1.06L13.109 13H11.16a3.75 3.75 0 0 1-2.873-1.34l-.787-.938z"></path>
            <path d="M.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5z"></path>
          </svg>
        </button>
        <button class="mp-ctrl-btn" id="mpBtnPrev" title="Précédent">
          <svg class="mp-ctrl-icon" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7z"></path>
          </svg>
        </button>
        <button class="mp-play-btn" id="mpBtnPlay" title="Lecture / Pause">
          <svg class="mp-play-icon" id="mpPlayIcon" viewBox="0 0 16 16" width="20" height="20" fill="#000" aria-hidden="true">
            <path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288z"></path>
          </svg>
          <svg class="mp-play-icon" id="mpPauseIcon" viewBox="0 0 16 16" width="20" height="20" fill="#000" aria-hidden="true" style="display:none">
            <path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"></path>
          </svg>
        </button>
        <button class="mp-ctrl-btn" id="mpBtnNext" title="Suivant">
          <svg class="mp-ctrl-icon" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"></path>
          </svg>
        </button>
        <button class="mp-ctrl-btn" id="mpBtnRepeat" title="Répéter">
          <!-- Contenu (tracé "playlist" vs "titre") reçu de la fenêtre principale via
               IPC (state.repeatIcon = #repeatIcon.innerHTML côté script.js/mini-player.js)
               et appliqué en innerHTML dans _applyState() — voir plus bas. -->
          <svg class="mp-ctrl-icon" id="mpRepeatIcon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75z"></path>
          </svg>
        </button>
      </div>
      <div class="mp-progress-row">
        <span class="mp-time" id="mpTimeCur">0:00</span>
        <div class="mp-prog-track" id="mpProgTrack">
          <div class="mp-prog-fill" id="mpProgFill"></div>
        </div>
        <span class="mp-time end" id="mpTimeEnd">—</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const PIP_W = 320, PIP_H = 320;

// ─────────────────────────────────────────────────────────────────
// THEMES — copie exacte de mini-player.js
// ─────────────────────────────────────────────────────────────────
const THEMES = {
  amoled: { bg:'#000000', elevated:'#000000', text:'#ffffff', sub:'#b3b3b3', deco:'rgba(255,255,255,0.1)', lyricsText:null, lyricsActive:null },
  clair:  { bg:'#f0f0f2', elevated:'#ffffff', text:'#121216', sub:'#50505a', deco:'rgba(0,0,0,0.08)',      lyricsText:'rgba(0,0,0,0.50)', lyricsActive:'#121216' },
  starry: { bg:'#000000', elevated:'transparent', text:'#ffffff', sub:'#c2d9f5', deco:'rgba(255,255,255,0.12)', lyricsText:null, lyricsActive:null },
};

// ─────────────────────────────────────────────────────────────────
// _applyBg — copie exacte de mini-player.js avec document au lieu de pipDoc
// ─────────────────────────────────────────────────────────────────
let _starryObs = null;
function _applyBg(key) {
  const t = THEMES[key] || THEMES.amoled;
  $('mp-bg-div')?.remove();
  $('mp-starry-bg')?.remove();
  if (_starryObs) { _starryObs.disconnect(); _starryObs = null; }

  if (key === 'starry') {
    _initStarry();
  } else {
    const bgDiv = document.createElement('div');
    bgDiv.id = 'mp-bg-div';
    Object.assign(bgDiv.style, {
      position:'fixed', inset:'0', zIndex:'-1',
      background:t.bg, width:'100%', height:'100%', pointerEvents:'none',
    });
    document.body.insertBefore(bgDiv, document.body.firstChild);
  }

  const root=$('mpRoot');
  if (root) { root.style.background=t.elevated; root.style.color=t.text; }
  const tw=$('mpTitleWrap'), aw=$('mpArtistWrap'), sl=$('mpLyricsSlot'), qs=$('mpQueueSlot');
  if (tw) tw.style.color=t.text;
  if (aw) aw.style.color=t.sub;
  if (sl) sl.style.borderTop=`1px solid ${t.deco}`;
  if (qs) { qs.style.borderTop=`1px solid ${t.deco}`; qs.style.color=t.text; }

  let lyricsStyle=$('mp-lyrics-colors');
  if (!lyricsStyle) {
    lyricsStyle=document.createElement('style'); lyricsStyle.id='mp-lyrics-colors';
    document.head.appendChild(lyricsStyle);
  }
  // Classes réelles générées par spicy-lyrics-engine.js : préfixe "sl2-"
  // (voir mini-player.js / mini-player.css — mêmes noms, même raison).
  lyricsStyle.textContent = t.lyricsText ? `
    #lyricsDisplayMirror .sl2-line,
    #lyricsDisplayMirror .sl2-bg-line { color:${t.lyricsText}!important; }
    #lyricsDisplayMirror .sl2-line.sl2-Active,
    #lyricsDisplayMirror .sl2-bg-line.sl2-Active { color:${t.lyricsActive}!important; }
  ` : '';
}

// ─────────────────────────────────────────────────────────────────
// _initStarry — copie exacte de _initStarryPip
// ─────────────────────────────────────────────────────────────────
function _initStarry() {
  if (!$('mp-starry-style')) {
    const st=document.createElement('style'); st.id='mp-starry-style';
    st.textContent=`
      .beartify-starry-bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#000000 0%,#142b44 100%);}
      .bsn-star{position:absolute;border-radius:50%;background:#fff;}
      .bsn-shooting{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;animation:bsnShoot 3s linear forwards;}
      .bsn-shooting::before{content:'';position:absolute;top:50%;transform:translateY(-50%);width:200px;height:1px;background:linear-gradient(90deg,#fff,transparent);}
      @keyframes bsnShoot{0%{transform:rotate(315deg) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(315deg) translateX(-800px);opacity:0}}
      @keyframes bsnTwinkle1{0%,80%,100%{box-shadow:0 0 8px 2px #fff}20%,40%,60%{box-shadow:none}}
      @keyframes bsnTwinkle2{0%,20%,100%{box-shadow:0 0 8px 2px #fff}40%,60%,80%{box-shadow:none}}
      @keyframes bsnTwinkle3{0%,40%,60%{box-shadow:0 0 8px 2px #fff}20%,80%,100%{box-shadow:none}}
      @keyframes bsnTwinkle4{0%,20%{box-shadow:none}40%,60%,80%{box-shadow:0 0 8px 2px #fff}100%{box-shadow:none}}
    `;
    document.head.appendChild(st);
  }
  const bg=document.createElement('div'); bg.className='beartify-starry-bg'; bg.id='mp-starry-bg';
  document.body.insertBefore(bg, document.body.firstChild);
  const _gen=container=>{
    container.querySelectorAll('.bsn-star').forEach(s=>s.remove());
    const w=container.clientWidth||PIP_W, h=container.clientHeight||PIP_H;
    const frag=document.createDocumentFragment();
    for (let i=0;i<Math.min(Math.floor((w*h)/4000),200);i++) {
      const size=Math.random()<0.6?1:2, el=document.createElement('div'); el.className='bsn-star';
      const tw=Math.random()<0.2?`animation:bsnTwinkle${Math.floor(Math.random()*4)+1} 5s infinite`:'';
      el.style.cssText=[`left:${(Math.random()*99).toFixed(2)}%`,`top:${(Math.random()*99).toFixed(2)}%`,`width:${size}px`,`height:${size}px`,`opacity:${(0.5+Math.random()*0.5).toFixed(2)}`,tw].filter(Boolean).join(';');
      frag.appendChild(el);
    }
    container.appendChild(frag);
  };
  const _shoot=container=>{
    const el=document.createElement('span'); el.className='bsn-shooting';
    const _pos=()=>{el.style.top='-4px';el.style.right=`${(Math.random()*90).toFixed(1)}%`;el.style.left='auto';};
    _pos(); el.style.animationDuration=`${Math.floor(Math.random()*3)+3}s`; el.style.animationDelay=`${Math.floor(Math.random()*7)}s`;
    el.addEventListener('animationend',()=>{_pos();el.style.animation='none';void el.offsetWidth;el.style.animation='';el.style.animationDuration=`${Math.floor(Math.random()*4)+3}s`;el.style.animationDelay='0s';});
    container.appendChild(el);
  };
  const _start=()=>{_gen(bg);for(let i=0;i<2;i++)_shoot(bg);};
  bg.clientWidth?_start():requestAnimationFrame(_start);
  if (window.ResizeObserver){_starryObs=new ResizeObserver(()=>_gen(bg));_starryObs.observe(bg);}
}

// ─────────────────────────────────────────────────────────────────
// Fond dynamique WebGL — copie exacte de _startDynBg/_updateDynBg
// ─────────────────────────────────────────────────────────────────
const ND_PIP={warpIntensity:1,blurPasses:8,animationSpeed:.1,saturation:1.0,dithering:.008,transitionDuration:1000,tintIntensity:0,scale:1};
let _renderer=null, _beatSync=null, _dynBgMode=false;

async function _startDynBg() {
  if (!window._ImmersiveBgRenderer) return false;
  const canvas=$('mpDynBgCanvas'); if(!canvas) return false;
  canvas.width=PIP_W; canvas.height=PIP_H; canvas.style.opacity='0';
  try{_renderer=new window._ImmersiveBgRenderer(canvas,ND_PIP);}
  catch(e){_renderer=null;return false;}
  const _scc=window._sampleCoverColors||((s,cb)=>cb(['#1a0a2e','#2e0a1a','#0a1a2e']));
  const src=window._mpCurrentImageUrl||'pictures/default-cover.png';
  await _renderer.loadImage(src).catch(()=>new Promise(r=>{_scc(src,cols=>{_renderer?.loadGradient(cols);r();});}));
  canvas.style.opacity='1';
  _renderer.start();
  if(window._BeatSync) _beatSync=new window._BeatSync();
  return true;
}
function _stopDynBg(){
  if(_renderer){_renderer.stop?.();_renderer.dispose?.();_renderer=null;}
  _beatSync=null;
  const canvas=$('mpDynBgCanvas'); if(canvas) canvas.style.opacity='0';
}
function _updateDynBgImage(src,bpm,loudness){
  if(!_renderer||!src) return;
  const _scc=window._sampleCoverColors||((s,cb)=>cb(['#1a0a2e','#2e0a1a','#0a1a2e']));
  _renderer.loadImage(src).catch(()=>new Promise(r=>{_scc(src,cols=>{_renderer?.loadGradient(cols);r();});}));
  if(_beatSync&&bpm) _beatSync.setTrack(bpm,loudness);
}

// Fallback dégradé CSS (identique à _updateDynBg dans mini-player.js)
function _updateCssDynBg(imageUrl, title, artist) {
  const dynBg=$('mpDynBg'); if(!dynBg) return;
  const src=imageUrl;
  const _fallback=()=>{
    const str=(title||'')+(artist||'');
    let h1=0,h2=137;
    for(let i=0;i<str.length;i++){h1=((h1<<5)-h1+str.charCodeAt(i))|0;h2=((h2<<3)+str.charCodeAt(i))|0;}
    const c1=`hsl(${Math.abs(h1)%360},40%,18%)`, c2=`hsl(${Math.abs(h2)%360},50%,12%)`;
    dynBg.style.background=`linear-gradient(135deg,${c1},${c2},${c1})`;
  };
  if(!src){_fallback();return;}
  const img=new Image(); img.crossOrigin='anonymous';
  const _timer=setTimeout(_fallback,1500);
  img.onload=()=>{
    clearTimeout(_timer);
    try{
      const c=document.createElement('canvas'); c.width=4; c.height=4;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,4,4);
      const d=ctx.getImageData(0,0,4,4).data;
      const c1=`rgb(${d[0]},${d[1]},${d[2]})`,c2=`rgb(${d[48]},${d[49]},${d[50]})`,c3=`rgb(${Math.round((d[0]+d[48])/2)},${Math.round((d[1]+d[49])/2)},${Math.round((d[2]+d[50])/2)})`;
      dynBg.style.background=`linear-gradient(135deg,${c1},${c3},${c2})`;
    }catch{_fallback();}
  };
  img.onerror=()=>{clearTimeout(_timer);_fallback();};
  img.src=src;
}

// ─────────────────────────────────────────────────────────────────
// Marquee — copie exacte
// ─────────────────────────────────────────────────────────────────
function _esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _marquee(wrapId,text){
  const wrap=$(wrapId); if(!wrap) return;
  wrap.classList.remove('has-marquee'); wrap.innerHTML='';
  const inner=document.createElement('span'); inner.className='marquee-inner'; inner.textContent=text;
  wrap.appendChild(inner);
  requestAnimationFrame(()=>{
    const ov=inner.scrollWidth-wrap.clientWidth;
    if(ov>6){
      const gap=52,total=inner.scrollWidth+gap, safe=_esc(text);
      inner.innerHTML=`<span class="marquee-orig">${safe}</span><span style="display:inline-block;width:${gap}px"></span><span class="marquee-clone" aria-hidden="true">${safe}</span>`;
      inner.style.setProperty('--marquee-offset',`-${total}px`);
      inner.style.setProperty('--marquee-duration',`${Math.max(8,total/16)}s`);
      inner.classList.add('marquee-on'); wrap.classList.add('has-marquee');
    }
  });
}

// ─────────────────────────────────────────────────────────────────
// Appliquer l'état reçu
// ─────────────────────────────────────────────────────────────────
let _lastImg='', _lastTheme='';
function _applyState(s){
  if(!s) return;
  // Thème
  if(s.theme!==_lastTheme){ _applyBg(s.theme||'amoled'); _lastTheme=s.theme||'amoled'; }
  // Track
  _marquee('mpTitleWrap',  s.title ||'—');
  _marquee('mpArtistWrap', s.artist||'—');
  if(s.imageUrl&&s.imageUrl!==_lastImg){
    _lastImg=s.imageUrl;
    window._mpCurrentImageUrl=s.imageUrl;
    const ci=$('mpCoverImg'),oi=$('mpOverlayImg');
    if(ci) ci.src=s.imageUrl; if(oi) oi.src=s.imageUrl;
    if(_dynBgMode) _updateDynBgImage(s.imageUrl,s.bpm,s.loudness);
  }
  // Play/Pause
  const pi=$('mpPlayIcon'),pai=$('mpPauseIcon');
  if(pi&&pai){pi.style.display=s.playing?'none':'';pai.style.display=s.playing?'':'none';}
  // Repeat — copie le innerHTML du SVG (tracé "playlist" ↔ "titre"), pas .src
  // (repeatIcon est un <svg>, .src n'existe pas dessus — voir mini-player.js).
  if(s.repeatIcon){const ri=$('mpRepeatIcon');if(ri) ri.innerHTML=s.repeatIcon;}
}

// ─────────────────────────────────────────────────────────────────
// Paroles — vrai miroir DOM de #lyricsDisplay (mêmes classes sl2-,
// mêmes styles que spicy-lyrics.css/mini-player.css), reçu de la
// fenêtre principale par IPC. Remplace l'ancien widget texte
// prev/cur/next fait main (aucun rapport visuel avec le site).
// ─────────────────────────────────────────────────────────────────
let _lyricsFlat = null; // même flatten que côté mini-player.js (index → élément)

function _scrollToActiveLyric(behavior) {
  const slot = $('mpLyricsSlot'); if (!slot) return;
  let active = slot.querySelector('.sl2-line.sl2-Active:not(.sl2-musical-line)');
  if (!active) {
    const s = slot.querySelectorAll('.sl2-line.sl2-Sung:not(.sl2-musical-line)');
    if (s.length) active = s[s.length - 1];
  }
  if (!active) return;
  const ch = slot.clientHeight; if (!ch) return;
  const cRect = slot.getBoundingClientRect(), lRect = active.getBoundingClientRect();
  const relTop = lRect.top - cRect.top + slot.scrollTop;
  const target = relTop - ch / 2 + active.offsetHeight / 2;
  slot.scrollTo({ top: Math.max(0, target), behavior: behavior || 'smooth' });
}

function _applyLyricsRebuild(payload) {
  const slot = $('mpLyricsSlot'); if (!slot) return;
  const html = payload?.html || '';
  slot.innerHTML = html
    ? `<div id="lyricsDisplayMirror" class="sl2-lyrics-display">${html}</div>`
    : '';
  const wrapper = $('lyricsDisplayMirror');
  if (wrapper) {
    // Mêmes overrides que le miroir web (_buildMirror dans mini-player.js)
    wrapper.style.setProperty('display', 'block', 'important');
    wrapper.style.setProperty('--DefaultLyricsSize', '1.65rem', 'important');
    wrapper.style.setProperty('mask-image', 'none', 'important');
    wrapper.style.setProperty('-webkit-mask-image', 'none', 'important');
    const sc = wrapper.querySelector('.sl2-scroll-container');
    if (sc) {
      sc.style.setProperty('padding', '0 10px 60px', 'important');
      sc.style.setProperty('margin', '0', 'important');
    }
    _lyricsFlat = [wrapper, ...wrapper.querySelectorAll('*')];
  } else {
    _lyricsFlat = null;
  }
  requestAnimationFrame(() => requestAnimationFrame(() => _scrollToActiveLyric('instant')));
}

function _applyLyricsClass(payload) {
  if (!_lyricsFlat) return;
  (payload?.updates || []).forEach(u => {
    const el = _lyricsFlat[u.index];
    if (el) el.className = u.className;
  });
  _scrollToActiveLyric('smooth');
}

// ─────────────────────────────────────────────────────────────────
// Progression
// ─────────────────────────────────────────────────────────────────
function _fmt(s){if(!isFinite(s)||s<0)return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
let _dragging=false,_lastDur=0;
function _applyProgress(cur,dur){
  const f=$('mpProgFill'),tc=$('mpTimeCur'),te=$('mpTimeEnd');
  if(f)  f.style.width=dur>0?`${(cur/dur)*100}%`:'0%';
  if(tc) tc.textContent=_fmt(cur);
  if(te) te.textContent=dur>0?_fmt(dur):'—';
}
function _seek(e){
  const t=$('mpProgTrack');if(!t||!_lastDur) return;
  const r=t.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  _cmd('seek',{value:pct*_lastDur}); _applyProgress(pct*_lastDur,_lastDur);
}
$('mpProgTrack')?.addEventListener('mousedown',e=>{_dragging=true;_seek(e);$('mpProgFill').style.transition='none';});
document.addEventListener('mousemove',e=>{if(_dragging)_seek(e);});
document.addEventListener('mouseup',()=>{if(_dragging){_dragging=false;$('mpProgFill').style.transition='';}});

// ─────────────────────────────────────────────────────────────────
// File d'attente
// ─────────────────────────────────────────────────────────────────
let _queueMode=false;
function _setQueue(on){
  _queueMode=on;
  const slot=$('mpQueueSlot'),tog=$('mpQueueToggle'),lyr=$('mpLyricsSlot');
  if(!slot) return;
  if(on){slot.classList.add('active');if(lyr)lyr.style.display='none';tog?.classList.add('active');_cmd('getQueue');}
  else  {slot.classList.remove('active');slot.innerHTML='';if(lyr)lyr.style.display='';tog?.classList.remove('active');}
}
function _renderQueue(items){
  const slot=$('mpQueueSlot');if(!slot||!_queueMode) return;
  slot.innerHTML='';
  if(!items?.length){slot.innerHTML="<p style='padding:14px;opacity:.5;font-size:.77rem;text-align:center'>File d'attente vide</p>";return;}
  items.forEach(item=>{
    const row=document.createElement('div');row.className='mp-q-item';
    row.innerHTML=`${item.imageUrl?`<img class="mp-q-thumb" src="${item.imageUrl}" alt="">`:'<div class="mp-q-thumb"></div>'}
      <div class="mp-q-info"><div class="mp-q-title">${(item.title||'—').replace(/</g,'&lt;')}</div>
      <div class="mp-q-artist">${(item.artist||'').replace(/</g,'&lt;')}</div></div>
      ${item.duration?`<div class="mp-q-dur">${_fmt(item.duration)}</div>`:''}`;
    row.addEventListener('click',()=>{_cmd('playIdx',{idx:item.idx});_setQueue(false);});
    slot.appendChild(row);
  });
}

// ─────────────────────────────────────────────────────────────────
// Commandes Tauri
// ─────────────────────────────────────────────────────────────────
function _cmd(cmd,extra){
  window.__TAURI__?.core?.invoke('relay_event',{
    target:'main',event:'beartify://mp-cmd',payload:{cmd,...extra},
  }).catch?.(_=>{});
}

// Fermer — mousedown pour ne pas dépendre du recalcul du hover
$('tauriCloseBtn')?.addEventListener('mousedown',e=>{
  e.preventDefault(); e.stopPropagation();
  window.__TAURI__?.window?.getCurrentWindow()?.close();
});

// Transport
$('mpBtnPlay')?.addEventListener('click',()=>_cmd('play'));
$('mpBtnPrev')?.addEventListener('click',()=>_cmd('prev'));
$('mpBtnNext')?.addEventListener('click',()=>_cmd('next'));
$('mpBtnShuffle')?.addEventListener('click',()=>_cmd('shuffle'));
$('mpBtnRepeat')?.addEventListener('click',()=>_cmd('repeat'));
$('mpQueueToggle')?.addEventListener('click',e=>{e.stopPropagation();_setQueue(!_queueMode);});
$('mpDynBgToggle')?.addEventListener('click',async e=>{
  e.stopPropagation();
  _dynBgMode=!_dynBgMode;
  $('mpDynBgToggle')?.classList.toggle('active',_dynBgMode);
  if(_dynBgMode){
    const ok=await _startDynBg();
    if(!ok) _dynBgMode=false;
  } else {
    _stopDynBg();
  }
});

// ─────────────────────────────────────────────────────────────────
// Init Tauri
// ─────────────────────────────────────────────────────────────────
async function _init(){
  let n=0; while(!window.__TAURI__?.event?.listen&&n++<30) await new Promise(r=>setTimeout(r,100));
  const ev=window.__TAURI__?.event; if(!ev?.listen) return;

  await ev.listen('beartify://mp-msg',({payload:d})=>{
    if(!d) return;
    switch(d.type){
      case 'state':         _applyState(d.payload);                           break;
      case 'lyricsRebuild': _applyLyricsRebuild(d.payload);                   break;
      case 'lyricsClass':   _applyLyricsClass(d.payload);                     break;
      case 'progress': if(!_dragging){_lastDur=d.payload?.duration||0;_applyProgress(d.payload?.currentTime||0,_lastDur);} break;
      case 'queue':    _renderQueue(d.payload?.items);                    break;
    }
  });

  const _req=()=>_cmd('getState');
  _req(); setTimeout(_req,600); setTimeout(_req,1800);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',_init);
else _init();

})();
</script>
