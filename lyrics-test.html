        function createMusicalDots(container, startTime, endTime, oppositeAligned) {
            const musicalLine = document.createElement('div');
            musicalLine.classList.add('line', 'musical-line');
            
            if (oppositeAligned) {
                musicalLine.classList.add('OppositeAligned');
            }
            
            window.LyricsObject.Types.Syllable.Lines.push({
                HTMLElement: musicalLine,
                StartTime: startTime,
                EndTime: endTime,
                TotalTime: endTime - startTime,
                DotLine: true,
                Syllables: { Lead: [] }
            });
            
            const currentIdx = window.LyricsObject.Types.Syllable.Lines.length - 1;
            const dotGroup = document.createElement('div');
            dotGroup.classList.add('dotGroup');
            
            const totalTime = endTime - startTime;
            // Optimisation des timings pour les dots
            const dotTime = totalTime / 3.3;
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.textContent = '•';
                dot.className = 'word dot';
                
                // Timing ajusté pour éviter les problèmes
                const dotStartTime = startTime + i * dotTime;
                const dotEndTime = dotStartTime + dotTime * 0.9;
                
                window.LyricsObject.Types.Syllable.Lines[currentIdx].Syllables.Lead.push({
                    HTMLElement: dot,
                    StartTime: dotStartTime,
                    EndTime: dotEndTime,
                    TotalTime: dotEndTime - dotStartTime,
                    Dot: true,
                    DotIndex: i
                });
                
                dotGroup.appendChild(dot);
            }
            
            musicalLine.appendChild(dotGroup);
            container.appendChild(musicalLine);
        }

        // ============================================================================
        // ANIMATION COMPLÈTE AVEC SPRING PHYSICS - VERSION AMÉLIORÉE
        // ============================================================================
        
        let lastFrameTime = performance.now();
        let lastAnimateFrameTime = 0;
        let Blurring_LastLine = null;

        function applyBlur(arr, activeIndex, blurMultiplierValue) {
            if (!arr[activeIndex]) return;

            arr[activeIndex].HTMLElement.style.setProperty("--BlurAmount", "0px");

            const max = BlurMultiplier * 5 + BlurMultiplier * 0.465;

            for (let i = activeIndex + 1; i < arr.length; i++) {
                const blurAmount = blurMultiplierValue * (i - activeIndex);
                if (getElementState(AppState.currentPosition + timeOffset, arr[i].StartTime, arr[i].EndTime) === "Active") {
                    arr[i].HTMLElement.style.setProperty("--BlurAmount", "0px");
                } else {
                    arr[i].HTMLElement.style.setProperty(
                        "--BlurAmount",
                        `${blurAmount >= max ? max : blurAmount}px`
                    );
                }
            }

            for (let i = activeIndex - 1; i >= 0; i--) {
                const blurAmount = blurMultiplierValue * (activeIndex - i);
                if (getElementState(AppState.currentPosition + timeOffset, arr[i].StartTime, arr[i].EndTime) === "Active") {
                    arr[i].HTMLElement.style.setProperty("--BlurAmount", "0px");
                } else {
                    arr[i].HTMLElement.style.setProperty(
                        "--BlurAmount",
                        `${blurAmount >= max ? max : blurAmount}px`
                    );
                }
            }
        }

        function animateLyrics(position) {
            const ProcessedPosition = position + timeOffset - (Config.SimpleLyricsMode ? 33.5 : 0);
            
            const now = performance.now();
            
            if (now - lastAnimateFrameTime < FRAME_INTERVAL) {
                return;
            }
            
            const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.05);
            lastFrameTime = now;
            lastAnimateFrameTime = now;

            const arr = window.LyricsObject.Types.Syllable.Lines;
            const blurMultiplierValue = Config.isSpicySidebarMode ? SidebarBlurMultiplier : BlurMultiplier;
            
            let currentActiveLineIndex = -1;

            for (let index = 0; index < arr.length; index++) {
                const line = arr[index];
                const lineState = getElementState(ProcessedPosition, line.StartTime, line.EndTime);

                if (lineState === "Active") {
                    currentActiveLineIndex = index;
                    
                    if (Blurring_LastLine !== index) {
                        applyBlur(arr, index, blurMultiplierValue);
                        Blurring_LastLine = index;
                    }
                    
                    // AUTO-SCROLL AMÉLIORÉ (depuis alpha.html)
                    if (lastActiveLineIndex !== index) {
                        scrollToActiveLine();
                        lastActiveLineIndex = index;
                    }

                    line.HTMLElement.classList.add("Active");
                    line.HTMLElement.classList.remove("NotSung", "Sung");

                    if (!line.Syllables?.Lead) continue;

                    const words = line.Syllables.Lead;
                    
                    for (let wordIndex = 0; wordIndex < words.length; wordIndex++) {
                        const word = words[wordIndex];
                        const wordState = getElementState(ProcessedPosition, word.StartTime, word.EndTime);
                        const percentage = getProgressPercentage(ProcessedPosition, word.StartTime, word.EndTime);
                        const isLetterGroup = word?.LetterGroup;
                        const isDot = word?.Dot;

                        if (isDot && !isLetterGroup) {
                            if (!word.AnimatorStore) {
                                word.AnimatorStore = createDotSprings();
                                word.AnimatorStore.Scale.SetGoal(DotScaleSpline.at(0), true);
                                word.AnimatorStore.YOffset.SetGoal(DotYOffsetSpline.at(0), true);
                                word.AnimatorStore.Glow.SetGoal(DotGlowSpline.at(0), true);
                                word.AnimatorStore.Opacity.SetGoal(DotOpacitySpline.at(0), true);
                            }

                            let targetScale, targetYOffset, targetGlow, targetOpacity;

                            if (wordState === "Active") {
                                // Timing ajusté pour éviter les problèmes de retour
                                const adjustedPercentage = word.DotIndex === 2 ? 
                                    Math.min(percentage, 0.92) : percentage;
                                
                                targetScale = DotScaleSpline.at(adjustedPercentage);
                                targetYOffset = DotYOffsetSpline.at(adjustedPercentage);
                                targetGlow = DotGlowSpline.at(adjustedPercentage);
                                targetOpacity = DotOpacitySpline.at(adjustedPercentage);
                            } else if (wordState === "NotSung") {
                                targetScale = DotScaleSpline.at(0);
                                targetYOffset = DotYOffsetSpline.at(0);
                                targetGlow = DotGlowSpline.at(0);
                                targetOpacity = DotOpacitySpline.at(0);
                            } else {
                                targetScale = DotScaleSpline.at(1);
                                targetYOffset = DotYOffsetSpline.at(1);
                                targetGlow = DotGlowSpline.at(1);
                                targetOpacity = DotOpacitySpline.at(1);
                            }

                            word.AnimatorStore.Scale.SetGoal(targetScale);
                            word.AnimatorStore.YOffset.SetGoal(targetYOffset);
                            word.AnimatorStore.Glow.SetGoal(targetGlow);
                            word.AnimatorStore.Opacity.SetGoal(targetOpacity);

                            const currentScale = word.AnimatorStore.Scale.Step(deltaTime);
                            const currentYOffset = word.AnimatorStore.YOffset.Step(deltaTime);
                            const currentGlow = word.AnimatorStore.Glow.Step(deltaTime);
                            const currentOpacity = word.AnimatorStore.Opacity.Step(deltaTime);

                            word.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset || 0}))`;
                            word.HTMLElement.style.scale = `${currentScale}`;
                            word.HTMLElement.style.opacity = `${currentOpacity}`;
                            word.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 6 * currentGlow}px`);
                            word.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * 90}%`);
                        }
                        else if (!isDot && !isLetterGroup) {
                            if (!word.AnimatorStore) {
                                word.AnimatorStore = createWordSprings();
                                word.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0), true);
                                word.AnimatorStore.YOffset.SetGoal(YOffsetSpline.at(0), true);
                                word.AnimatorStore.Glow.SetGoal(GlowSpline.at(0), true);
                            }

                            let targetScale, targetYOffset, targetGlow, targetGradientPos;
                            const totalDuration = word.EndTime - word.StartTime;

                            if (wordState === "Active") {
                                targetScale = ScaleSpline.at(percentage);
                                targetYOffset = YOffsetSpline.at(percentage);
                                targetGlow = GlowSpline.at(percentage);
                                targetGradientPos = Config.SimpleLyricsMode ? -50 + 150 * percentage : -20 + 120 * percentage;
                            } else if (wordState === "NotSung") {
                                targetScale = ScaleSpline.at(0);
                                targetYOffset = YOffsetSpline.at(0);
                                targetGlow = GlowSpline.at(0);
                                targetGradientPos = Config.SimpleLyricsMode ? -50 : -20;
                            } else {
                                targetScale = ScaleSpline.at(1);
                                targetYOffset = YOffsetSpline.at(1);
                                targetGlow = GlowSpline.at(1);
                                targetGradientPos = 100;
                            }

                            word.AnimatorStore.Scale.SetGoal(targetScale);
                            word.AnimatorStore.YOffset.SetGoal(targetYOffset);
                            word.AnimatorStore.Glow.SetGoal(targetGlow);

                            const currentScale = word.AnimatorStore.Scale.Step(deltaTime);
                            const currentYOffset = word.AnimatorStore.YOffset.Step(deltaTime);
                            const currentGlow = word.AnimatorStore.Glow.Step(deltaTime);

                            word.HTMLElement.style.scale = `${currentScale}`;
                            word.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset}))`;
                            
                            if (Config.SimpleLyricsMode) {
                                if (Config.SimpleLyricsMode_RenderingType === "calculate") {
                                    word.HTMLElement.style.setProperty('--SLM_GradientPosition', `${targetGradientPos}%`);
                                } else {
                                    if (wordState === "Active" && !word.SLMAnimated) {
                                        word.HTMLElement.style.removeProperty('--SLM_GradientPosition');
                                        word.HTMLElement.style.animation = getSLMAnimation(totalDuration);
                                        word.SLMAnimated = true;
                                        word.PreSLMAnimated = false;
                                        
                                        const nextWord = words[wordIndex + 1];
                                        if (nextWord && !nextWord.Dot && !nextWord.PreSLMAnimated) {
                                            nextWord.PreSLMAnimated = true;
                                            nextWord.HTMLElement.style.removeProperty('--SLM_GradientPosition');
                                            setTimeout(() => {
                                                if (nextWord.HTMLElement) {
                                                    nextWord.HTMLElement.style.animation = getPreSLMAnimation(125);
                                                }
                                            }, Number(totalDuration * 0.6 - 22) || totalDuration);
                                        }
                                    }
                                    if (wordState === "NotSung") {
                                        if (!word.PreSLMAnimated) {
                                            word.HTMLElement.style.animation = "none";
                                            word.HTMLElement.style.setProperty("--SLM_GradientPosition", "-50%");
                                        }
                                        word.SLMAnimated = false;
                                    }
                                    if (wordState === "Sung") {
                                        word.HTMLElement.style.animation = "none";
                                        word.HTMLElement.style.setProperty("--SLM_GradientPosition", "100%");
                                        word.SLMAnimated = false;
                                        word.PreSLMAnimated = false;
                                    }
                                }
                            } else {
                                word.HTMLElement.style.setProperty('--gradient-position', `${targetGradientPos}%`);
                            }
                            
                            word.HTMLElement.style.setProperty('--text-shadow-blur-radius', `${4 + 2 * currentGlow}px`);
                            word.HTMLElement.style.setProperty('--text-shadow-opacity', `${Math.min(currentGlow * 35, 100)}%`);
                        }

                        if (isLetterGroup && word.Letters) {
                            if (wordState === "Active") {
                                let activeLetterIndex = -1;
                                let activeLetterPercentage = 0;
                                
                                for (let i = 0; i < word.Letters.length; i++) {
                                    const letter = word.Letters[i];
                                    if (getElementState(ProcessedPosition, letter.StartTime, letter.EndTime) === "Active") {
                                        activeLetterIndex = i;
                                        activeLetterPercentage = getProgressPercentage(ProcessedPosition, letter.StartTime, letter.EndTime);
                                        break;
                                    }
                                }

                                for (let k = 0; k < word.Letters.length; k++) {
                                    const letter = word.Letters[k];
                                    const letterState = getElementState(ProcessedPosition, letter.StartTime, letter.EndTime);

                                    if (!letter.AnimatorStore) {
                                        letter.AnimatorStore = createLetterSprings();
                                        letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0), true);
                                        letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(0), true);
                                        letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(0), true);
                                    }

                                    let targetScale = ScaleSpline.at(0);
                                    let targetYOffset = LetterYOffsetSpline.at(0);
                                    let targetGlow = GlowSpline.at(0);
                                    let targetGradient;

                                    if (activeLetterIndex !== -1) {
                                        const percentageCount = Config.SimpleLyricsMode
                                            ? getProgressPercentage(ProcessedPosition, word.StartTime, word.EndTime)
                                            : activeLetterPercentage;

                                        const config = SimpleLyricsMode_LetterEffectsStrengthConfig;
                                        const baseScale = ScaleSpline.at(percentageCount) * 
                                            (Config.SimpleLyricsMode
                                                ? word.TotalTime > config.LongerThan ? config.Longer.Scale : config.Shorter.Scale
                                                : 1);
                                        const baseYOffset = LetterYOffsetSpline.at(percentageCount) *
                                            (Config.SimpleLyricsMode
                                                ? word.TotalTime > config.LongerThan ? config.Longer.YOffset : config.Shorter.YOffset
                                                : 1);
                                        const baseGlow = GlowSpline.at(percentageCount) *
                                            (Config.SimpleLyricsMode
                                                ? word.TotalTime > config.LongerThan ? config.Longer.Glow : config.Shorter.Glow
                                                : 1);

                                        const restingScale = ScaleSpline.at(0);
                                        const restingYOffset = LetterYOffsetSpline.at(0);
                                        const restingGlow = GlowSpline.at(0);

                                        const distance = Math.abs(k - activeLetterIndex);
                                        const falloff = Math.max(0, 1 / (1 + distance * 0.9));

                                        targetScale = restingScale + (baseScale - restingScale) * falloff;
                                        targetYOffset = restingYOffset + (baseYOffset - restingYOffset) * falloff;
                                        targetGlow = restingGlow + (baseGlow - restingGlow) * falloff;
                                    }

                                    if (letterState === "NotSung" && !Config.SimpleLyricsMode) {
                                        targetScale = ScaleSpline.at(0);
                                        targetYOffset = LetterYOffsetSpline.at(0);
                                        targetGlow = GlowSpline.at(0);
                                    } else if (letterState === "Sung" && activeLetterIndex === -1) {
                                        targetGlow = GlowSpline.at(SungLetterGlow);
                                    }

                                    if (letterState === "NotSung") {
                                        targetGradient = Config.SimpleLyricsMode ? -50 : -20;
                                    } else if (letterState === "Sung") {
                                        targetGradient = 100;
                                    } else {
                                        const letterProgress = getProgressPercentage(ProcessedPosition, letter.StartTime, letter.EndTime);
                                        targetGradient = k === activeLetterIndex
                                            ? (Config.SimpleLyricsMode ? -50 : -20) + 150 * easeSinOut(letterProgress)
                                            : k < activeLetterIndex 
                                                ? 100
                                                : (Config.SimpleLyricsMode ? -50 : -20);
                                    }

                                    letter.AnimatorStore.Scale.SetGoal(targetScale);
                                    letter.AnimatorStore.YOffset.SetGoal(targetYOffset);
                                    letter.AnimatorStore.Glow.SetGoal(targetGlow);

                                    const currentScale = letter.AnimatorStore.Scale.Step(deltaTime);
                                    const currentYOffset = letter.AnimatorStore.YOffset.Step(deltaTime);
                                    const currentGlow = letter.AnimatorStore.Glow.Step(deltaTime);

                                    const totalDuration = letter.EndTime - letter.StartTime;

                                    if (Config.SimpleLyricsMode) {
                                        if (Config.SimpleLyricsMode_RenderingType === "calculate") {
                                            letter.HTMLElement.style.setProperty("--SLM_GradientPosition", `${targetGradient}%`);
                                        } else {
                                            if (letterState === "Active" && !letter.SLMAnimated) {
                                                letter.HTMLElement.style.removeProperty("--SLM_GradientPosition");
                                                letter.HTMLElement.style.animation = getSLMAnimation(totalDuration);
                                                letter.SLMAnimated = true;
                                            }
                                            if (letterState === "NotSung") {
                                                if (!letter.PreSLMAnimated) {
                                                    letter.HTMLElement.style.animation = "none";
                                                    letter.HTMLElement.style.setProperty("--SLM_GradientPosition", "-50%");
                                                }
                                                letter.SLMAnimated = false;
                                            }
                                            if (letterState === "Sung") {
                                                letter.HTMLElement.style.animation = "none";
                                                letter.HTMLElement.style.setProperty("--SLM_GradientPosition", "100%");
                                                letter.SLMAnimated = false;
                                            }
                                        }
                                    } else {
                                        letter.HTMLElement.style.setProperty("--gradient-position", `${targetGradient}%`);
                                    }

                                    letter.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset * 2}))`;
                                    letter.HTMLElement.style.scale = `${currentScale}`;
                                    letter.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 12 * currentGlow}px`);
                                    letter.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * LetterGlowMultiplier_Opacity}%`);
                                }
                            }
                            else if (wordState === "NotSung") {
                                for (const letter of word.Letters) {
                                    if (!letter.AnimatorStore) {
                                        letter.AnimatorStore = createLetterSprings();
                                        letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0), true);
                                        letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(0), true);
                                        letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(0), true);
                                    }

                                    letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0));
                                    letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(0));
                                    letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(0));

                                    const currentScale = letter.AnimatorStore.Scale.Step(deltaTime);
                                    const currentYOffset = letter.AnimatorStore.YOffset.Step(deltaTime);
                                    const currentGlow = letter.AnimatorStore.Glow.Step(deltaTime);

                                    if (Config.SimpleLyricsMode) {
                                        letter.HTMLElement.style.animation = "none";
                                        letter.HTMLElement.style.setProperty("--SLM_GradientPosition", "-50%");
                                    } else {
                                        letter.HTMLElement.style.setProperty("--gradient-position", "-20%");
                                    }
                                    letter.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset * 2}))`;
                                    letter.HTMLElement.style.scale = `${currentScale}`;
                                    letter.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 12 * currentGlow}px`);
                                    letter.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * LetterGlowMultiplier_Opacity}%`);
                                }
                            }
                            else if (wordState === "Sung") {
                                for (const letter of word.Letters) {
                                    if (!letter.AnimatorStore) {
                                        letter.AnimatorStore = createLetterSprings();
                                        letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0), true);
                                        letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(0), true);
                                        letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(0), true);
                                    }

                                    letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(1));
                                    letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(1));
                                    letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(1));

                                    const currentScale = letter.AnimatorStore.Scale.Step(deltaTime);
                                    const currentYOffset = letter.AnimatorStore.YOffset.Step(deltaTime);
                                    const currentGlow = letter.AnimatorStore.Glow.Step(deltaTime);

                                    if (Config.SimpleLyricsMode) {
                                        letter.HTMLElement.style.animation = "none";
                                        letter.HTMLElement.style.setProperty("--SLM_GradientPosition", "100%");
                                    } else {
                                        letter.HTMLElement.style.setProperty("--gradient-position", "100%");
                                    }
                                    letter.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset * 2}))`;
                                    letter.HTMLElement.style.scale = `${currentScale}`;
                                    letter.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 12 * currentGlow}px`);
                                    letter.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * LetterGlowMultiplier_Opacity}%`);
                                }
                            }
                        }
                    }
                }
                else if (lineState === "NotSung") {
                    line.HTMLElement.classList.add("NotSung");
                    line.HTMLElement.classList.remove("Sung", "Active");
                    
                    if (line.DotLine && line.Syllables?.Lead) {
                        const dots = line.Syllables.Lead;
                        for (const dot of dots) {
                            if (dot.Dot && dot.AnimatorStore) {
                                dot.AnimatorStore.Scale.SetGoal(DotScaleSpline.at(0), true);
                                dot.AnimatorStore.YOffset.SetGoal(DotYOffsetSpline.at(0), true);
                                dot.AnimatorStore.Glow.SetGoal(DotGlowSpline.at(0), true);
                                dot.AnimatorStore.Opacity.SetGoal(DotOpacitySpline.at(0), true);
                                
                                dot.HTMLElement.style.transform = `translateY(0)`;
                                dot.HTMLElement.style.scale = `${DotScaleSpline.at(0)}`;
                                dot.HTMLElement.style.opacity = `${DotOpacitySpline.at(0)}`;
                                dot.HTMLElement.style.setProperty("--text-shadow-blur-radius", `4px`);
                                dot.HTMLElement.style.setProperty("--text-shadow-opacity", `0%`);
                            }
                        }
                    }
                }
                else if (lineState === "Sung") {
                    line.HTMLElement.classList.add("Sung");
                    line.HTMLElement.classList.remove("Active", "NotSung");

                    const words = line.Syllables?.Lead;
                    if (!words) continue;
                    
                    for (const word of words) {
                        if (word.Dot && word.AnimatorStore) {
                            // Pour les dots, dans l'état Sung, on les laisse à leur état final (éclairés)
                            word.AnimatorStore.Scale.SetGoal(DotScaleSpline.at(1));
                            word.AnimatorStore.YOffset.SetGoal(DotYOffsetSpline.at(1));
                            word.AnimatorStore.Glow.SetGoal(DotGlowSpline.at(1));
                            word.AnimatorStore.Opacity.SetGoal(DotOpacitySpline.at(1));
                            
                            const currentScale = word.AnimatorStore.Scale.Step(deltaTime);
                            const currentYOffset = word.AnimatorStore.YOffset.Step(deltaTime);
                            const currentGlow = word.AnimatorStore.Glow.Step(deltaTime);
                            const currentOpacity = word.AnimatorStore.Opacity.Step(deltaTime);
                            
                            word.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset || 0}))`;
                            word.HTMLElement.style.scale = `${currentScale}`;
                            word.HTMLElement.style.opacity = `${currentOpacity}`;
                            word.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 6 * currentGlow}px`);
                            word.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * 90}%`);
                            continue;
                        }
                        
                        if (word.AnimatorStore && !word.Dot) {
                            word.AnimatorStore.Scale.SetGoal(ScaleSpline.at(1));
                            word.AnimatorStore.YOffset.SetGoal(YOffsetSpline.at(1));
                            word.AnimatorStore.Glow.SetGoal(GlowSpline.at(1));
                            
                            const currentScale = word.AnimatorStore.Scale.Step(deltaTime);
                            const currentYOffset = word.AnimatorStore.YOffset.Step(deltaTime);
                            const currentGlow = word.AnimatorStore.Glow.Step(deltaTime);
                            
                            word.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset}))`;
                            word.HTMLElement.style.scale = `${currentScale}`;
                            
                            if (!word.LetterGroup) {
                                if (Config.SimpleLyricsMode) {
                                    word.HTMLElement.style.animation = "none";
                                    word.HTMLElement.style.setProperty("--SLM_GradientPosition", "100%");
                                } else {
                                    word.HTMLElement.style.setProperty("--gradient-position", "100%");
                                }
                                word.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 2 * currentGlow}px`);
                                word.HTMLElement.style.setProperty("--text-shadow-opacity", `${Math.min(currentGlow * 35, 100)}%`);
                            }
                        }
                        
                        if (word.LetterGroup && word.Letters) {
                            for (const letter of word.Letters) {
                                if (!letter.AnimatorStore) {
                                    letter.AnimatorStore = createLetterSprings();
                                    letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(0), true);
                                    letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(0), true);
                                    letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(0), true);
                                }

                                letter.AnimatorStore.Scale.SetGoal(ScaleSpline.at(1));
                                letter.AnimatorStore.YOffset.SetGoal(LetterYOffsetSpline.at(1));
                                letter.AnimatorStore.Glow.SetGoal(GlowSpline.at(1));

                                const currentScale = letter.AnimatorStore.Scale.Step(deltaTime);
                                const currentYOffset = letter.AnimatorStore.YOffset.Step(deltaTime);
                                const currentGlow = letter.AnimatorStore.Glow.Step(deltaTime);

                                if (Config.SimpleLyricsMode) {
                                    letter.HTMLElement.style.animation = "none";
                                    letter.HTMLElement.style.setProperty("--SLM_GradientPosition", "100%");
                                } else {
                                    letter.HTMLElement.style.setProperty("--gradient-position", "100%");
                                }
                                letter.HTMLElement.style.transform = `translateY(calc(var(--DefaultLyricsSize) * ${currentYOffset * 2}))`;
                                letter.HTMLElement.style.scale = `${currentScale}`;
                                letter.HTMLElement.style.setProperty("--text-shadow-blur-radius", `${4 + 12 * currentGlow}px`);
                                letter.HTMLElement.style.setProperty("--text-shadow-opacity", `${currentGlow * LetterGlowMultiplier_Opacity}%`);
                            }
                        }
                    }
                }
            }
        }

        function animationLoop() {
            if (AppState.isPlaying && AppState.lyrics) {
                animateLyrics(AppState.currentPosition);
            }
            requestAnimationFrame(animationLoop);
        }

        // ============================================================================
        // FONCTION POUR BASCULER LE MODE SIMPLE LYRICS
        // ============================================================================
        
        function toggleSimpleMode() {
            Config.SimpleLyricsMode = !Config.SimpleLyricsMode;
            
            YOffsetSpline = GetSpline(Config.SimpleLyricsMode ? SimpleYOffsetRange : YOffsetRange);
            
            if (Config.SimpleLyricsMode) {
                document.body.classList.add('SimpleLyricsMode');
            } else {
                document.body.classList.remove('SimpleLyricsMode');
            }
            
            if (AppState.lyrics) {
                applySyllableLyrics(AppState.lyrics);
            }
            
            console.log('Simple Mode:', Config.SimpleLyricsMode);
        }

        // ============================================================================
        // FONCTION POUR REJOUER LA MUSIQUE
        // ============================================================================
        
        function replayMusic() {
            const audioPlayer = document.getElementById('audio-player');
            if (audioPlayer) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
                console.log('Replay de la musique');
            }
        }

        // ============================================================================
        // EVENT LISTENERS
        // ============================================================================
        
        document.addEventListener('DOMContentLoaded', () => {
            const audioPlayer = document.getElementById('audio-player');
            const videoBackground = document.getElementById('video-background');
            const headerToggle = document.getElementById('header-toggle');
            const header = document.getElementById('header');
            const progressBar = document.getElementById('progress-bar');
            const playPauseBtn = document.getElementById('btn-play-pause');
            const playPauseIcon = document.getElementById('play-pause-icon');
            const headerImg = headerToggle.querySelector('img');
            
            // Configurer la vidéo pour une meilleure performance
            videoBackground.loop = true;
            videoBackground.muted = true;
            videoBackground.playsInline = true;
            videoBackground.preload = "auto";
            
            // Toggle header
            headerToggle.addEventListener('click', () => {
                header.classList.toggle('hidden');
                if (header.classList.contains('hidden')) {
                    headerImg.style.transform = 'rotate(180deg)';
                } else {
                    headerImg.style.transform = 'rotate(0deg)';
                }
            });
            
            // Import music
            document.getElementById('btn-import-music').addEventListener('click', () => {
                document.getElementById('file-music').click();
            });
            
            document.getElementById('file-music').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    audioPlayer.src = URL.createObjectURL(file);
                    document.getElementById('status-audio').textContent = `Audio: ${file.name}`;
                    console.log('Musique chargée:', file.name);
                    
                    audioPlayer.addEventListener('loadedmetadata', () => {
                        AppState.audioDuration = audioPlayer.duration * 1000;
                        updateDuration(AppState.audioDuration);
                    });
                }
            });
            
            // Import lyrics
            document.getElementById('btn-import-lyrics').addEventListener('click', () => {
                document.getElementById('file-lyrics').click();
            });
            
            document.getElementById('file-lyrics').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = parseJSON(event.target.result);
                            AppState.lyrics = data;
                            document.getElementById('status-lyrics').textContent = `Paroles: ${file.name}`;
                            applySyllableLyrics(data);
                        } catch (error) {
                            console.error(error);
                        }
                    };
                    reader.readAsText(file);
                }
            });
            
            // Import video background - AMÉLIORÉ POUR LE RESPONSIVE
            document.getElementById('btn-import-video').addEventListener('click', () => {
                document.getElementById('file-video').click();
            });
            
            document.getElementById('file-video').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    videoBackground.src = URL.createObjectURL(file);
                    document.body.classList.add('video-mode');
                    
                    // Attendre que la vidéo soit prête avant de jouer
                    videoBackground.addEventListener('loadeddata', () => {
                        videoBackground.play().catch(e => {
                            console.log('Auto-play bloqué, attente de l\'interaction utilisateur');
                        });
                    });
                    
                    // Synchronisation vidéo améliorée
                    videoBackground.addEventListener('timeupdate', () => {
                        if (Math.abs(videoBackground.currentTime - audioPlayer.currentTime) > 1) {
                            if (audioPlayer.currentTime < videoBackground.duration) {
                                videoBackground.currentTime = audioPlayer.currentTime;
                            }
                        }
                    });
                    
                    console.log('Vidéo d\'arrière-plan chargée:', file.name);
                }
            });
            
            // Simple mode
            document.getElementById('btn-simple-mode').addEventListener('click', toggleSimpleMode);
            
            // Play/Pause fusionné
            playPauseBtn.addEventListener('click', () => {
                if (audioPlayer.paused) {
                    audioPlayer.play().then(() => {
                        playPauseIcon.src = 'pictures/pause.png';
                        if (videoBackground.src && document.body.classList.contains('video-mode')) {
                            videoBackground.play().catch(e => {
                                console.log('Échec de lecture vidéo:', e);
                            });
                        }
                    }).catch(e => {
                        console.log('Échec de lecture audio:', e);
                    });
                } else {
                    audioPlayer.pause();
                    playPauseIcon.src = 'pictures/play.png';
                    if (videoBackground.src) videoBackground.pause();
                }
            });
            
            // Replay
            document.getElementById('btn-replay').addEventListener('click', replayMusic);
            
            // Progress bar click to seek
            progressBar.addEventListener('click', (e) => {
                if (!audioPlayer.src) return;
                
                const rect = progressBar.getBoundingClientRect();
                const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                const percentage = x / rect.width;
                const newTime = percentage * audioPlayer.duration;
                
                audioPlayer.currentTime = newTime;
                AppState.currentPosition = newTime * 1000;
                
                updateTimeDisplay(AppState.currentPosition);
                updateProgressBar(AppState.currentPosition, AppState.audioDuration);
                
                // Synchroniser la vidéo
                if (videoBackground.src && document.body.classList.contains('video-mode')) {
                    videoBackground.currentTime = newTime;
                }
            });
            
            // Sync audio
            audioPlayer.addEventListener('timeupdate', function() {
                AppState.currentPosition = this.currentTime * 1000;
                updateTimeDisplay(AppState.currentPosition);
                updateProgressBar(AppState.currentPosition, AppState.audioDuration);
                
                // Synchronisation vidéo améliorée
                if (videoBackground.src && document.body.classList.contains('video-mode')) {
                    if (Math.abs(videoBackground.currentTime - this.currentTime) > 0.5) {
                        videoBackground.currentTime = this.currentTime;
                    }
                }
            });
            
            audioPlayer.addEventListener('loadedmetadata', function() {
                AppState.audioDuration = this.duration * 1000;
                updateDuration(AppState.audioDuration);
            });
            
            audioPlayer.addEventListener('play', () => {
                AppState.isPlaying = true;
                playPauseIcon.src = 'pictures/pause.png';
                if (videoBackground.src && document.body.classList.contains('video-mode')) {
                    videoBackground.play().catch(e => {
                        console.log('Échec de lecture vidéo:', e);
                    });
                }
                console.log('Lecture démarrée');
            });
            
            audioPlayer.addEventListener('pause', () => {
                AppState.isPlaying = false;
                playPauseIcon.src = 'pictures/play.png';
                if (videoBackground.src) videoBackground.pause();
                console.log('Lecture en pause');
            });
            
            // Click to seek on lyrics
            document.querySelector('.LyricsContainer')?.addEventListener('click', (e) => {
                if (e.target.classList.contains('word') || e.target.classList.contains('letter')) {
                    window.LyricsObject.Types.Syllable.Lines.forEach((line) => {
                        if (line.Syllables?.Lead) {
                            line.Syllables.Lead.forEach((word) => {
                                if (word.HTMLElement === e.target) {
                                    audioPlayer.currentTime = word.StartTime / 1000;
                                    AppState.currentPosition = word.StartTime;
                                    if (videoBackground.src && document.body.classList.contains('video-mode')) {
                                        videoBackground.currentTime = word.StartTime / 1000;
                                    }
                                    console.log('Navigation vers:', word.StartTime / 1000, 's');
                                } else if (word.Letters) {
                                    word.Letters.forEach((letter) => {
                                        if (letter.HTMLElement === e.target) {
                                            audioPlayer.currentTime = letter.StartTime / 1000;
                                            AppState.currentPosition = letter.StartTime;
                                            if (videoBackground.src && document.body.classList.contains('video-mode')) {
                                                videoBackground.currentTime = letter.StartTime / 1000;
                                            }
                                            console.log('Navigation vers lettre:', letter.StartTime / 1000, 's');
                                        }
                                    });
                                }
                            });
                        }
                    });
                }
            });
            
            animationLoop();
            
            console.log('Lyrics Bear initialisé');
        });
    </script>
</body>
</html>
